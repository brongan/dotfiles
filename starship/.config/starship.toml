palette = "google_dark"

shell = ["sh"]

# Timeout for starship to scan files (in milliseconds)
scan_timeout = 30

command_timeout = 1000

[palettes.google_dark]
dark_grey = "#333333"
mid_grey = "#444444"
light_grey = "#555555"
white = "#ffffff"
yellow = "#ffff00"
red = "#ff0000"
blue = "#0000ff"
purple = "#800080"

format = """\
$username\
$hostname\
$shlvl\
$singularity\
$directory\
$docker_context\
$nix_shell\
$conda\
$aws\
$gcloud\
$env_var\
$cmd_duration\
$custom\
$line_break\
$jobs\
$battery\
$time\
$status\
$character\
"""

[aws]
disabled = false
format = '[[](bg:#444444 fg:#333333)[on](bg:#444444 fg:white) $symbol$profile(\($region\))[](bg:#333333 fg:#444444)]($style)'
symbol = " "
style = "bold bg:#444444 fg:yellow"

[battery]
disabled = false
full_symbol = ""
charging_symbol = ""
discharging_symbol = ""
format = "[[](bg:#555555 fg:#333333)$symbol$percentage[](bg:#333333 fg:#555555)]($style)"
[[battery.display]]
threshold = 10
style = "bg:#555555 fg:red"

[character]
disabled = false
format = "$symbol "
success_symbol = "[[](bg:green fg:#333333)](fg:green)"
error_symbol = "[[](bg:red fg:#333333)](fg:red)"
vicmd_symbol = "[[](fg:green bg:#333333)](bg:green fg:#000000)"

[cmake]
